{
  "seed": 42,
  "data_config": "configs/data.yaml",
  "lora": {
    "r": 16,
    "lora_alpha": 32,
    "lora_dropout": 0.0,
    "target_modules": [
      "q_proj",
      "v_proj"
    ],
    "task_type": "CAUSAL_LM"
  },
