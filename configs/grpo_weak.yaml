    "top_p": 0.95,
    "use_vllm": false,
    "remove_unused_columns": false,
    "eval_strategy": "no",
    "loss_type": "grpo",
    "scale_rewards": "group"
  },
  "stage": "grpo_weak",
  "profiles": {
    "smoke": {
      "max_steps": 2,
      "max_completion_length": 128
    },
    "pilot": {
      "max_steps": 20,
      "max_completion_length": 256
    },
    "full": {
      "max_steps": 100,
      "max_completion_length": 512
    }
  },
  "initial_checkpoint": null,
  "correctness_verifier": "weak",
  "reward_weights": [
    0.2,
    1.0
  ]
