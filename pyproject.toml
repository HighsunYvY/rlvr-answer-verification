[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifierlab-rlvr"
version = "0.1.0"
description = "Verifier reliability in small-scale mathematical RLVR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.57.1", "trl==0.24.0", "peft==0.17.1", "datasets==4.3.0", "accelerate==1.11.0"]
analysis = ["pandas==2.3.3", "matplotlib==3.10.7"]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
